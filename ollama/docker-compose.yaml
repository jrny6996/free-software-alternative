# Local LLM runtime — CPU (default)
# https://ollama.com
#
# Start:  docker compose up -d
# GPU:    docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml up -d
# API:    http://localhost:11434
#
# Pull a model after start:
#   docker compose exec ollama ollama pull llama3.2
#
# CPU note: works fine for small models (e.g. llama3.2:1b, phi3:mini).
# Larger models are slow without a GPU — that's part of the TCO tradeoff.
#
# Desktop GUI alternative (not Docker): https://lmstudio.ai

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama

  # Optional Open WebUI front-end (ChatGPT-like chat)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    profiles:
      - webui

volumes:
  ollama:
  open-webui:
